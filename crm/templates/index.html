<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A3 健身私教 CRM</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, "PingFang SC", "Microsoft YaHei", sans-serif;
      color: #172033;
      background: #f3f6fb;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; }
    .shell { display: grid; grid-template-columns: 280px minmax(0, 1fr); min-height: 100vh; }
    aside { padding: 32px 24px; color: white; background: #172554; }
    .brand { margin: 0 0 10px; font-size: 25px; }
    .subtitle { margin: 0; color: #bfdbfe; line-height: 1.7; font-size: 14px; }
    .status { margin-top: 32px; padding: 14px; border: 1px solid #334b86; border-radius: 12px; background: #1e3470; }
    .status strong { display: block; margin-bottom: 6px; }
    .dot { display: inline-block; width: 8px; height: 8px; margin-right: 7px; border-radius: 50%; background: #4ade80; }
    main { display: flex; justify-content: center; padding: 42px 24px; }
    .panel { display: flex; flex-direction: column; width: min(880px, 100%); min-height: calc(100vh - 84px); border: 1px solid #dbe3f0; border-radius: 20px; background: white; box-shadow: 0 16px 45px rgba(31, 49, 85, .08); overflow: hidden; }
    header { padding: 24px 28px; border-bottom: 1px solid #e8edf5; }
    header h2 { margin: 0 0 6px; font-size: 20px; }
    header p { margin: 0; color: #64748b; font-size: 14px; }
    #messages { flex: 1; padding: 28px; overflow-y: auto; }
    .message { max-width: 78%; margin-bottom: 18px; padding: 13px 16px; border-radius: 15px; line-height: 1.65; white-space: pre-wrap; }
    .assistant { border: 1px solid #dce5f3; background: #f7f9fd; }
    .user { margin-left: auto; color: white; background: #3157c8; }
    .meta { margin: -10px 0 18px; color: #718096; font-size: 12px; }
    form { padding: 20px 28px 26px; border-top: 1px solid #e8edf5; background: #fbfcfe; }
    label { color: #64748b; font-size: 13px; }
    input, textarea, button { font: inherit; }
    .profile { display: grid; grid-template-columns: minmax(120px, 1fr) 120px auto auto; gap: 10px; align-items: end; margin-bottom: 12px; }
    .field { display: flex; flex-direction: column; gap: 6px; }
    input { width: 100%; padding: 10px 11px; border: 1px solid #cbd5e1; border-radius: 10px; outline: none; }
    .composer { display: flex; gap: 10px; }
    textarea { flex: 1; min-height: 54px; max-height: 150px; padding: 14px; resize: vertical; border: 1px solid #cbd5e1; border-radius: 12px; outline: none; }
    input:focus, textarea:focus { border-color: #3157c8; box-shadow: 0 0 0 3px rgba(49, 87, 200, .12); }
    button { align-self: stretch; min-width: 100px; border: 0; border-radius: 12px; color: white; background: #3157c8; cursor: pointer; }
    .secondary { color: #3157c8; border: 1px solid #cbd5e1; background: white; }
    button:disabled { opacity: .55; cursor: wait; }
    .error { color: #b42318; background: #fff1f0; border-color: #fecaca; }
    @media (max-width: 760px) {
      .shell { display: block; }
      aside { padding: 20px 22px; }
      .status { display: none; }
      main { padding: 14px; }
      .panel { min-height: calc(100vh - 142px); }
      .message { max-width: 92%; }
      .profile { grid-template-columns: 1fr; }
      .composer { flex-direction: column; }
      button { min-height: 46px; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <aside>
      <h1 class="brand">A3 健身私教 CRM</h1>
      <p class="subtitle">面向健身房和私教工作室的动作搜索推荐、目标计划配置和健康评估工作台。</p>
      <div class="status">
        <strong><span class="dot"></span>服务运行中</strong>
        <span>{{ "AI 模型已启用" if openai_enabled else "本地降级模式" }}</span>
      </div>
    </aside>
    <main>
      <section class="panel">
        <header>
          <h2>智能健身私教助手</h2>
          <p>系统会识别动作推荐、锻炼目标和身高体重评估，并调用搜索、DeepSeek 或医学 RAG。</p>
        </header>
        <div id="messages" aria-live="polite">
          <div class="message assistant">你好，可以告诉我想练什么部位、锻炼目标，或直接输入身高体重做健康评估。</div>
        </div>
        <form id="chat-form">
          <div class="profile">
            <div class="field">
              <label for="customer-name">姓名</label>
              <input id="customer-name" name="customer-name" autocomplete="name" placeholder="例如：王明" required>
            </div>
            <div class="field">
              <label for="phone-tail">手机尾号</label>
              <input id="phone-tail" name="phone-tail" inputmode="numeric" maxlength="4" placeholder="后四位" required>
            </div>
            <button id="start-session" type="button">开始对话</button>
            <button id="end-session" class="secondary" type="button" disabled>结束对话</button>
          </div>
          <div class="composer">
            <textarea id="query" name="query" placeholder="例如：我想练背 / 我想减脂 / 身高 175cm 体重 82kg，需要健身吗？" required disabled></textarea>
            <button id="send" type="submit" disabled>发送</button>
          </div>
        </form>
      </section>
    </main>
  </div>
  <script>
    const form = document.querySelector("#chat-form");
    const messages = document.querySelector("#messages");
    const customerName = document.querySelector("#customer-name");
    const phoneTail = document.querySelector("#phone-tail");
    const startSession = document.querySelector("#start-session");
    const endSession = document.querySelector("#end-session");
    const query = document.querySelector("#query");
    const send = document.querySelector("#send");
    const intentNames = {1: "动作搜索推荐", 2: "锻炼目标与计划配置", 3: "身高体重健康评估", 4: "其他健身咨询"};
    let currentProfile = null;

    function addMessage(text, role) {
      const element = document.createElement("div");
      element.className = `message ${role}`;
      element.textContent = text;
      messages.appendChild(element);
      messages.scrollTop = messages.scrollHeight;
      return element;
    }

    function setSessionActive(active, profile = null) {
      currentProfile = profile;
      customerName.disabled = active;
      phoneTail.disabled = active;
      startSession.disabled = active;
      endSession.disabled = !active;
      query.disabled = !active;
      send.disabled = !active;
      if (active) query.focus();
    }

    startSession.addEventListener("click", async () => {
      const name = customerName.value.trim();
      const tail = phoneTail.value.trim();
      if (!name || !/^\d{4}$/.test(tail)) {
        addMessage("请先输入姓名和 4 位手机尾号。", "assistant").classList.add("error");
        return;
      }
      startSession.disabled = true;
      try {
        const response = await fetch("/api/session/start", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({name, phone_tail: tail})
        });
        if (!response.ok) throw new Error("建立用户档案失败。");
        const data = await response.json();
        setSessionActive(true, {name, phone_tail: tail, customer_id: data.customer_id});
        addMessage(`你好${name}，你对健身有什么问题？`, "assistant");
      } catch (error) {
        startSession.disabled = false;
        const element = addMessage(error.message || "建立用户档案失败。", "assistant");
        element.classList.add("error");
      }
    });

    endSession.addEventListener("click", async () => {
      await fetch("/api/session/end", {method: "POST"}).catch(() => {});
      setSessionActive(false);
      query.value = "";
      addMessage("本次对话已结束。再次输入姓名和手机尾号后，可以继续调用该用户档案。", "assistant");
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      if (!currentProfile) {
        addMessage("请先输入姓名和手机尾号，并点击开始对话。", "assistant").classList.add("error");
        return;
      }
      const question = query.value.trim();
      if (!question) return;
      addMessage(question, "user");
      query.value = "";
      send.disabled = true;
      const answer = addMessage("", "assistant");

      try {
        const response = await fetch("/chat", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({...currentProfile, query: question})
        });
        if (!response.ok || !response.body) throw new Error("请求失败，请检查服务状态。");

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";
        while (true) {
          const {value, done} = await reader.read();
          buffer += decoder.decode(value || new Uint8Array(), {stream: !done});
          const lines = buffer.split("\n");
          buffer = lines.pop() || "";
          for (const line of lines) {
            if (!line) continue;
            const eventData = JSON.parse(line);
            if (eventData.type === "meta") {
              const meta = document.createElement("div");
              meta.className = "meta";
              meta.textContent = `识别意图：${intentNames[eventData.intent_code] || "未知"}`;
              messages.insertBefore(meta, answer);
            } else if (eventData.type === "delta") {
              answer.textContent += eventData.text;
              messages.scrollTop = messages.scrollHeight;
            }
          }
          if (done) break;
        }
      } catch (error) {
        answer.classList.add("error");
        answer.textContent = error.message || "请求失败。";
      } finally {
        send.disabled = !currentProfile;
        query.focus();
      }
    });
  </script>
</body>
</html>
